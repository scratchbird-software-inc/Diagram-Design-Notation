<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DDN core + graph bundles only</title>
<style>body{font:16px system-ui;background:#edf2f8;color:#20374e;max-width:1200px;margin:30px auto;padding:0 20px}h1{font-size:24px}.status{font:14px ui-monospace,monospace;padding:8px 12px;border-radius:6px;margin:12px 0}.pass{background:#e2f4e5;color:#1d5c2e}.fail{background:#f9e2e2;color:#8a2a2a}code{background:#fff;padding:1px 5px;border-radius:4px}</style>
<h1>DDN core + graph bundles only</h1>
<p>B1-004 modular-bundle proof. Sources are inlined copies of <code>examples/basics/01-customer.ddn</code> (+ imports) so the page works over <code>file://</code>.</p>
<script src="../../notation/dist/ddn-core.js"></script>
<script src="../../notation/dist/ddn-graph.js"></script>
<div id="status" class="status">running…</div>
<div id="out"></div>
<script>
const files={
  "01-customer.ddn": "ddn \"0.3\";\nmodule \"ddn.examples.customer-views\";\nimport \"shared.ddn\" as shared;\nimport \"customer-data.ddn\" as customer;\n\nview overview \"Customer data / a shared model\" {\n    data: [@customer.model];\n    format: @shared.styles.technical;\n    legend: @shared.styles.numbers;\n    select: [@customer.model.customer, @customer.model.order, @customer.model.customer_identifier, @customer.model.customers];\n    legend { keys: { \"model.order_customer\": 7, \"model.customer_domain\": 12, \"model.order_domain\": 18 }; }\n    \n    \n    \n    \n    \n    \n    \n}\nview compact \"Customer data / compact view\" {\n    data: [@customer.model];\n    format: @shared.styles.technical;\n    display: @shared.styles.compact;\n    select: [@customer.model.order, @customer.model.customer];\n    \n    \n}\nview print \"Customer data / print rendition\" {\n    data: [@customer.model];\n    format: @shared.styles.technical;\n    style: @shared.styles.neutral;\n    publication: @shared.styles.paper;\n    select: [@customer.model.order, @customer.model.customer];\n    \n    \n}\n",
  "shared.ddn": "ddn \"0.3\";\nmodule \"ddn.examples.shared\";\n\nformat styles {\n    notation core { registry: \"ddn-core@0.3\"; }\n    style classic { look: classic; theme: default; font: sans; seed: 42; }\n    style hand { look: handDrawn; theme: default; font: handwriting; seed: 42; roughness: 1.8; hachure: true; }\n    style neo { look: neo; theme: default; font: sans; seed: 42; }\n    style dark { look: classic; theme: dark; font: sans; seed: 42; }\n    style neutral { look: classic; theme: neutral; font: mono; seed: 42; }\n    style forest { look: handDrawn; theme: forest; font: handwriting; seed: 42; roughness: 1.8; hachure: true; }\n    layout wires { algorithm: grid; routing: orthogonal; crossings: gap; direction: right; gap: 80px; }\n    display detailed { fields: names; kind: icon_token; maturity: token; badges: tokens; }\n    display compact { fields: none; kind: icon_token; maturity: none; badges: none; }\n    publication screen { size: content; width: 1360px; height: 860px; margin: 30px; minimum_text: 8pt; overflow: warn; }\n    publication paper { size: a4; orientation: landscape; margin: 8mm; minimum_text: 7pt; overflow: warn; }\n    legend words { mode: text; placement: right; width: 280px; }\n    legend numbers { mode: numbers; placement: right; width: 280px; }\n    bundle technical {\n        notation: @core;\n        style: @classic;\n        layout: @wires;\n        display: @detailed;\n        publication: @screen;\n        legend: @words;\n    }\n}\n",
  "customer-data.ddn": "ddn \"0.3\";\nmodule \"ddn.examples.customer-data\";\n\ndata model {\n    object customer \"Customer\" {\n        uid: \"urn:ddn:example:customer\";\n        kind: table;\n        maturity: draft;\n        workload: [oltp];\n        role: authoritative;\n        fields {\n            field customer_id { key: primary; domain: @customer_identifier; }\n            field display_name;\n            field status;\n        }\n    }\n    object order \"Order\" {\n        kind: table;\n        maturity: draft;\n        workload: [oltp];\n        fields {\n            field order_id { key: primary; }\n            field customer_id { domain: @customer_identifier; }\n            field ordered_at;\n        }\n    }\n    domain customer_identifier \"Customer identifier\" {\n        meaning: \"Identifies a customer in the registry\";\n        representation: undecided;\n    }\n    sample customers \"Synthetic customer records\" {\n        mode: synthetic;\n        columns: [@customer.customer_id, @customer.display_name, @customer.status];\n        rows: [[\"C001\", \"Customer A\", \"Active\"], [\"C002\", \"Customer B\", \"Suspended\"]];\n    }\n    relation order_customer @order.customer_id -> @customer.customer_id {\n        kind: references;\n        source_mark: zeromany;\n        target_mark: one;\n        enforcement: undecided;\n    }\n    relation customer_domain @customer.customer_id -> @customer_identifier { kind: uses_domain; }\n    relation order_domain @order.customer_id -> @customer_identifier { kind: uses_domain; }\n}\n"
};

const ws=DDNLive.createWorkspace(files);
const r=ws.renderSync({entry:'01-customer.ddn',view:'overview'});
document.querySelector('#out').innerHTML=r.svg;
const s=document.querySelector('#status');
s.textContent='pass-graph: ddn-core.js + ddn-graph.js rendered overview ('+r.svg.length+' SVG bytes); DDNLive '+DDNLive.VERSION+'; registered kinds: '+DDNEngine.registeredKinds().join(', ');
s.classList.add('pass');

</script></html>

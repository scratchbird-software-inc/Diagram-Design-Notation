name: DDN qualification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure short browser temporary path
        run: echo "DDN_TEMP_ROOT=$RUNNER_TEMP/ddn-browser" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/cache@v4
        with:
          path: .work/cache
          key: ddn-linux-x64-${{ hashFiles('tooling/bootstrap/*lock.json', 'tooling/browser/package-lock.json') }}
      - name: Bootstrap exact toolchain
        run: node tooling/bootstrap/bootstrap.mjs
      - name: Check contracts and standalone dependency boundary
        run: bash tooling/run.sh check
      - name: Unit and integration suites
        run: bash tooling/run.sh test:ddn
      - name: Bootstrap Chromium
        run: node tooling/browser/bootstrap.mjs
      - name: Install Chromium system dependencies
        run: .work/tools/toolchain/node/bin/node .work/tools/browser/node_modules/playwright/cli.js install-deps chromium
      - name: Build website and capture every gallery view
        run: bash tooling/run.sh build:ddn:website
      - name: Real-browser utility suites
        run: bash tooling/run.sh test:ddn:browser
      - name: Website suites
        run: bash tooling/run.sh test:ddn:website
      - name: Generate and validate wiki
        run: python3 tooling/wiki/build-wiki.py
      - name: Verify maintained site is reproducible
        run: git diff --exit-code -- website
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ddn-qualification
          path: .work/reports
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ddn-wiki
          path: .work/builds/wiki
          retention-days: 7

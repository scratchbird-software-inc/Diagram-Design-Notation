name: Build DDN release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node tooling/bootstrap/bootstrap.mjs
      - run: bash tooling/run.sh check
      - run: bash tooling/run.sh test:ddn
      - run: bash tooling/run.sh build:ddn
      - uses: actions/upload-artifact@v4
        with:
          name: ddn-next-1-standalone
          path: .work/builds/ddn-distribution
          retention-days: 7

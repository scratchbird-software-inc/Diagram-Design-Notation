name: Publish

# B1-031 (D5): npm publish readiness for @ddn/notation.
#
#   - Every push: packaging gate + `npm publish --dry-run` (no credentials needed;
#     the committed `private: true` in notation/package.json still permits dry-run).
#   - Tags matching v*: real publish — but only when the NPM_TOKEN repository
#     secret is configured. THE SECRET IS NOT SET YET: without it the publish
#     job skips gracefully with a notice, so tagging a release is safe before
#     npm credentials exist.
#   - `private: true` stays committed as an accident guard; the tag-gated job
#     removes it in the checked-out copy (`npm pkg delete private`) immediately
#     before publishing, and verifies the tag matches the package version.

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dev dependencies
        run: npm ci

      - name: Packaging gate (pack, extract, require the tarball)
        run: npm run test:packaging

      - name: npm publish dry-run
        working-directory: notation
        run: npm publish --dry-run --ignore-scripts --tag beta

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Skip gracefully — NPM_TOKEN secret is not configured
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN repository secret is not set; skipping the real npm publish. The dry-run job still validates packaging."

      - name: Verify the tag matches the package version
        if: env.NPM_TOKEN != ''
        working-directory: notation
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match notation/package.json version $PKG"
            exit 1
          fi

      - name: Packaging gate
        if: env.NPM_TOKEN != ''
        run: npm run test:packaging

      - name: Publish @ddn/notation to npm
        if: env.NPM_TOKEN != ''
        working-directory: notation
        run: |
          npm pkg delete private
          # prerelease versions require an explicit dist-tag
          npm publish --access public --ignore-scripts --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

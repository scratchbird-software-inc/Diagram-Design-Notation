<svg class="ddn-svg ddn-view-panels ddn-profile-canvas-empathy-1" xmlns="http://www.w3.org/2000/svg" width="1110" height="820" viewBox="0 0 1110 820" role="img" aria-labelledby="projection-title projection-description" style="font-family:DejaVu Sans, Arial, sans-serif"><title id="projection-title">Support team / empathy map</title><desc id="projection-description">canvas.empathy@1. Data-bound projection. Inspect marks to locate shared source definitions.</desc><rect width="100%" height="100%" fill="#F6F8FC"/><text x="30" y="38" font-size="11" fill="#17263D" font-weight="600" text-anchor="start" >DDN / 0.5 PROJECTION PREVIEW / canvas.empathy@1</text><text x="30" y="72" font-size="24" fill="#17263D" font-weight="650" text-anchor="start" >Support team / empathy map</text><g id="drawing" transform="translate(30 122) scale(1)"><rect x="0" y="0" width="1050" height="622" rx="0" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.8"/><g class="ddn-panel" data-panel="says"><rect x="0" y="0" width="514" height="226" rx="0" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.8"/><text x="16" y="28" font-size="14" fill="#17263D" font-weight="700" text-anchor="start" >SAYS</text><path d="M0 44L514 44" stroke="#D8E1EB" stroke-width="1" fill="none"/><g class="ddn-mark ddn-mark-panels" data-id="ddn.examples.empathy-scorecard::research.says_a" data-source-ids="[&quot;ddn.examples.empathy-scorecard::research.says_a&quot;]" data-projection-mark="mark:ddn.examples.empathy-scorecard::empathy:0" tabindex="0" role="group"><text x="16" y="72" font-size="14" fill="#17263D" font-weight="650" text-anchor="start" >Says (1)</text><text x="16" y="98" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >Synthetic: &quot;I spend half the shift retyping ticket details into the</text><text x="16" y="116" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >billing tool.&quot;</text></g><g class="ddn-mark ddn-mark-panels" data-id="ddn.examples.empathy-scorecard::research.says_b" data-source-ids="[&quot;ddn.examples.empathy-scorecard::research.says_b&quot;]" data-projection-mark="mark:ddn.examples.empathy-scorecard::empathy:1" tabindex="0" role="group"><text x="16" y="153" font-size="14" fill="#17263D" font-weight="650" text-anchor="start" >Says (2)</text><text x="16" y="179" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >Synthetic: &quot;Customers forgive an outage when we call them back before</text><text x="16" y="197" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >they notice.&quot;</text></g></g><g class="ddn-panel" data-panel="thinks"><rect x="536" y="0" width="514" height="226" rx="0" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.8"/><text x="552" y="28" font-size="14" fill="#17263D" font-weight="700" text-anchor="start" >THINKS</text><path d="M536 44L1050 44" stroke="#D8E1EB" stroke-width="1" fill="none"/><g class="ddn-mark ddn-mark-panels" data-id="ddn.examples.empathy-scorecard::research.thinks" data-source-ids="[&quot;ddn.examples.empathy-scorecard::research.thinks&quot;]" data-projection-mark="mark:ddn.examples.empathy-scorecard::empathy:2" tabindex="0" role="group"><text x="552" y="72" font-size="14" fill="#17263D" font-weight="650" text-anchor="start" >Thinks</text><text x="552" y="98" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >Synthetic: worries that automation metrics reward closing tickets</text><text x="552" y="116" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >fast, not solving the root cause.</text></g></g><g class="ddn-panel" data-panel="persona"><rect x="0" y="248" width="1050" height="160" rx="0" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.8"/><text x="16" y="276" font-size="14" fill="#17263D" font-weight="700" text-anchor="start" >PERSONA</text><path d="M0 292L1050 292" stroke="#D8E1EB" stroke-width="1" fill="none"/><g class="ddn-mark ddn-mark-panels" data-id="ddn.examples.empathy-scorecard::research.persona" data-source-ids="[&quot;ddn.examples.empathy-scorecard::research.persona&quot;]" data-projection-mark="mark:ddn.examples.empathy-scorecard::empathy:3" tabindex="0" role="group"><text x="16" y="320" font-size="14" fill="#17263D" font-weight="650" text-anchor="start" >Persona</text><text x="16" y="346" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >Synthetic persona: a support agent on the night shift.</text></g></g><g class="ddn-panel" data-panel="does"><rect x="0" y="430" width="514" height="160" rx="0" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.8"/><text x="16" y="458" font-size="14" fill="#17263D" font-weight="700" text-anchor="start" >DOES</text><path d="M0 474L514 474" stroke="#D8E1EB" stroke-width="1" fill="none"/><g class="ddn-mark ddn-mark-panels" data-id="ddn.examples.empathy-scorecard::research.does" data-source-ids="[&quot;ddn.examples.empathy-scorecard::research.does&quot;]" data-projection-mark="mark:ddn.examples.empathy-scorecard::empathy:4" tabindex="0" role="group"><text x="16" y="502" font-size="14" fill="#17263D" font-weight="650" text-anchor="start" >Does</text><text x="16" y="528" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >Synthetic: keeps a personal spreadsheet of workarounds and shares it</text><text x="16" y="546" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >with the next shift over chat.</text></g></g><g class="ddn-panel" data-panel="feels"><rect x="536" y="430" width="514" height="160" rx="0" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.8"/><text x="552" y="458" font-size="14" fill="#17263D" font-weight="700" text-anchor="start" >FEELS</text><path d="M536 474L1050 474" stroke="#D8E1EB" stroke-width="1" fill="none"/><g class="ddn-mark ddn-mark-panels" data-id="ddn.examples.empathy-scorecard::research.feels" data-source-ids="[&quot;ddn.examples.empathy-scorecard::research.feels&quot;]" data-projection-mark="mark:ddn.examples.empathy-scorecard::empathy:5" tabindex="0" role="group"><text x="552" y="502" font-size="14" fill="#17263D" font-weight="650" text-anchor="start" >Feels</text><text x="552" y="528" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >Synthetic: proud of calm incident handling but drained by the</text><text x="552" y="546" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >duplicated data entry.</text></g></g></g><path d="M30 767L1080 767" stroke="#D8E1EB" stroke-width="1" fill="none"/><text x="30" y="790" font-size="11" fill="#17263D" font-weight="400" text-anchor="start" >One model · source-bound occurrences · classic / default</text><text x="1080" y="790" font-size="11" fill="#17263D" font-weight="600" text-anchor="end" >panels</text></svg>
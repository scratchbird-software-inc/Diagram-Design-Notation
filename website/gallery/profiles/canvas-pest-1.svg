ial</text><text x="552" y="98" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >Synthetic: younger Aurelians</text><text x="552" y="116" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >favor low-sugar craft sodas</text><text x="552" y="134" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >and reusable packaging.</text></g></g><g class="ddn-panel" data-panel="technological"><rect x="804" y="0" width="246" height="181" rx="0" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.8"/><text x="820" y="28" font-size="14" fill="#17263D" font-weight="700" text-anchor="start" >TECHNOLOGICAL</text><path d="M804 44L1050 44" stroke="#D8E1EB" stroke-width="1" fill="none"/><g class="ddn-mark ddn-mark-panels" data-id="ddn.examples.canvas-pack-b::scan.pest_technological" data-source-ids="[&quot;ddn.examples.canvas-pack-b::scan.pest_technological&quot;]" data-projection-mark="mark:ddn.examples.canvas-pack-b::pest:3" tabindex="0" role="group"><text x="820" y="72" font-size="14" fill="#17263D" font-weight="650" text-anchor="start" >Technological</text><text x="820" y="98" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >Synthetic: mobile ordering</text><text x="820" y="116" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >covers most urban Aurelian</text><text x="820" y="134" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >retail, but cold-chain logistics</text><text x="820" y="152" font-size="12" fill="#17263D" font-weight="400" text-anchor="start" >remain patchy inland.</text></g></g></g><path d="M30 358L1080 358" stroke="#D8E1EB" stroke-width="1" fill="none"/><text x="30" y="381" font-size="11" fill="#17263D" font-weight="400" text-anchor="start" >One model · source-bound occurrences · classic / default</text><text x="1080" y="381" font-size="11" fill="#17263D" font-weight="600" text-anchor="end" >panels</text></svg>
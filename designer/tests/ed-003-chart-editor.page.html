<script type="application/json" id="files">{"projections/model.ddn":"ddn \"0.4\";\nmodule \"meridian.procurement.review\";\n\n// One synthetic procurement model, reused by graph, matrix and time projections.\ndata process {\n    object start \"Purchase request\" { kind: \"flow.start\"; }\n    object capture \"Capture requested items\" { kind: \"flow.io\"; }\n    object approve \"Approval granted?\" { kind: \"flow.decision\"; }\n    object order \"Issue purchase order\" {\n        kind: \"flow.process\";\n        x_record: { start: \"2026-01-05\", end: \"2026-01-07\", status: \"Complete\" };\n    }\n    object receive \"Receive and inspect\" {\n        kind: \"flow.process\";\n        x_record: { start: \"2026-01-08\", end: \"2026-01-12\", status: \"Complete\" };\n    }\n    object invoice \"Matched supplier invoice\" { kind: \"flow.document\"; }\n    object post \"Post authorized liability\" {\n        kind: \"flow.subprocess\";\n        x_record: { start: \"2026-01-13\", end: \"2026-01-16\", status: \"Planned\" };\n    }\n    object reject \"Return for correction\" { kind: \"flow.process\"; }\n    object close \"Request closed\" { kind: \"flow.end\"; }\n    relation p01 \"Request\" @start -> @capture { kind: \"flow.next\"; }\n    relation p02 \"Submit\" @capture -> @approve { kind: \"flow.next\"; }\n    relation p03 \"Approved\" @approve -> @order { kind: \"flow.next\"; x_diagram: { branch: \"approved\" }; }\n    relation p04 \"Rejected\" @approve -> @reject { kind: \"flow.next\"; x_diagram: { branch: \"rejected\" }; }\n    relation p05 \"Receive\" @order -> @receive { kind: \"flow.next\"; }\n    relation p06 \"Match\" @receive -> @invoice { kind: \"flow.next\"; }\n    relation p07 \"Authorize\" @invoice -> @post { kind: \"flow.next\"; }\n    relation p08 \"Complete\" @post -> @close { kind: \"flow.next\"; }\n    relation p09 \"Notify requester\" @reject -> @close { kind: \"flow.next\"; }\n}\ndata roles {\n    object buyer \"Buyer\" { kind: \"analysis.role\"; }\n    object manager \"Purchasing manager\" { kind: \"analysis.role\"; }\n    object warehouse \"Warehouse supervisor\" { kind: \"analysis.role\"; }\n    object controller \"Financial controller\" { kind: \"analysis.role\"; }\n}\ndata responsibilities {\n    relation order_r \"Prepare order\" @process.order -> @roles.buyer { kind: \"analysis.assignment\"; x_assignment: {code:\"R\"}; }\n    relation order_a \"Approve purchase\" @process.order -> @roles.manager { kind: \"analysis.assignment\"; x_assignment: {code:\"A\"}; }\n    relation receive_r \"Accept goods\" @process.receive -> @roles.warehouse { kind: \"analysis.assignment\"; x_assignment: {code:\"R\"}; }\n    relation receive_a \"Own acceptance\" @process.receive -> @roles.manager { kind: \"analysis.assignment\"; x_assignment: {code:\"A\"}; }\n    relation post_r \"Prepare posting\" @process.post -> @roles.buyer { kind: \"analysis.assignment\"; x_assignment: {code:\"R\"}; }\n    relation post_c \"Provide receipt evidence\" @process.post -> @roles.warehouse { kind: \"analysis.assignment\"; x_assignment: {code:\"C\"}; }\n    relation post_a \"Own financial effect\" @process.post -> @roles.controller { kind: \"analysis.assignment\"; x_assignment: {code:\"A\"}; }\n}\ndata schedule {\n    relation order_before_receive \"Order precedes receipt\" @process.order -> @process.receive { kind: \"analysis.precedes\"; }\n    relation receive_before_post \"Receipt precedes posting\" @process.receive -> @process.post { kind: \"analysis.precedes\"; }\n}\ndata schema {\n    object supplier \"Supplier\" { kind: entity; fields { field supplier_id { key: primary; } field name; } }\n    object po \"Purchase order\" { kind: entity; fields { field order_id { key: primary; } field approved_on; field total; } }\n    object receipt \"Goods receipt\" { kind: entity; fields { field receipt_id { key: primary; } field received_on; } }\n    relation supplied_by \"Placed with\" @po -> @supplier { kind: assoc; }\n    relation receipts_for \"Fulfils\" @receipt -> @po { kind: assoc; }\n}\ndata access {\n    relation access_po \"Create and read orders\" @process.order -> @schema.po { kind: \"analysis.access\"; x_assignment: {code:\"CR\"}; }\n    relation access_supplier \"Read suppliers\" @process.order -> @schema.supplier { kind: \"analysis.access\"; x_assignment: {code:\"R\"}; }\n    relation access_receipt \"Create receipts\" @process.receive -> @schema.receipt { kind: \"analysis.access\"; x_assignment: {code:\"C\"}; }\n    relation access_match \"Read receipts\" @process.post -> @schema.receipt { kind: \"analysis.access\"; x_assignment: {code:\"R\"}; }\n    relation access_post \"Read and update orders\" @process.post -> @schema.po { kind: \"analysis.access\"; x_assignment: {code:\"RU\"}; }\n}\ndata dfd {\n    object supplier \"Supplier\" { kind: \"dfd.external\"; }\n    object match \"Match invoice\" { kind: \"dfd.process\"; x_diagram: {number:\"1.0\",owner:\"Accounts payable\"}; }\n    object receipts \"Accepted receipts\" { kind: \"dfd.store\"; x_diagram: {number:\"D1\"}; }\n    object post \"Post payable\" { kind: \"dfd.process\"; x_diagram: {number:\"2.0\",owner:\"Financial control\"}; }\n    object ledger \"Payables ledger\" { kind: \"dfd.store\"; x_diagram: {number:\"D2\"}; }\n    object treasury \"Treasury\" { kind: \"dfd.external\"; }\n    relation a \"Invoice\" @supplier -> @match { kind: \"dfd.data\"; }\n    relation b \"Receipt evidence\" @receipts -> @match { kind: \"dfd.data\"; }\n    relation c \"Matched obligation\" @match -> @post { kind: \"dfd.data\"; }\n    relation d \"Authorized posting\" @post -> @ledger { kind: \"dfd.data\"; }\n    relation e \"Payment request\" @post -> @treasury { kind: \"dfd.data\"; }\n}\ndata classes {\n    object order \"PurchaseOrder\" {\n        kind: \"uml.class\";\n        fields {\n            field id \"id: OrderIdentifier\" { x_member: {kind:\"attribute\",visibility:\"private\"}; }\n            field total \"total: Money\" { x_member: {kind:\"attribute\",visibility:\"private\"}; }\n            field approve \"approve(actor): Decision\" { x_member: {kind:\"operation\",visibility:\"public\"}; }\n            field cancel \"cancel(reason): void\" { x_member: {kind:\"operation\",visibility:\"public\"}; }\n        }\n    }\n    object audited \"AuditedRecord\" { kind: \"uml.class\"; fields {field version \"version: Integer\" { x_member:{kind:\"attribute\",visibility:\"protected\"}; }} }\n    object repo \"OrderRepository\" { kind: \"uml.interface\"; fields {field save \"save(order): Result\" {x_member:{kind:\"operation\",visibility:\"public\",abstract:true};}} }\n    object adapter \"SqlOrderRepository\" { kind: \"uml.class\"; fields {field save \"save(order): Result\" {x_member:{kind:\"operation\",visibility:\"public\"};}} }\n    object component \"Purchasing service\" { kind: \"uml.component\"; }\n    object package \"Procurement\" { kind: \"uml.package\"; }\n    relation base \"Generalizes to\" @order -> @audited { kind: \"uml.generalization\"; }\n    relation realization \"Implements\" @adapter -> @repo { kind: \"uml.realization\"; }\n    relation uses \"Persists\" @component -> @repo { kind: \"uml.dependency\"; }\n    relation dep \"Depends on\" @package -> @component { kind: \"uml.dependency\"; }\n}\ndata usecases {\n    object buyer \"Buyer\" { kind: \"uml.actor\"; }\n    object create \"Create purchase order\" { kind: \"uml.usecase\"; }\n    object validate \"Validate supplier\" { kind: \"uml.usecase\"; }\n    object expedite \"Expedite delivery\" { kind: \"uml.usecase\"; }\n    relation uses \"Participates\" @buyer -> @create { kind: \"uml.uses\"; }\n    relation include \"«include»\" @create -> @validate { kind: \"uml.include\"; }\n    relation extend \"«extend»\" @expedite -> @create { kind: \"uml.extend\"; }\n}\ndata requirements {\n    object approval \"Authorized purchasing\" { kind: \"req.requirement\"; x_diagram: {code:\"REQ-01\",text:\"A purchase order must be approved by an authorized actor before issue.\"}; }\n    object matching \"Evidence-backed posting\" { kind: \"req.requirement\"; x_diagram: {code:\"REQ-02\",text:\"Posting requires matched receipt and invoice evidence at an approved cutoff.\"}; }\n    object service \"Purchasing command service\" { kind: \"req.implementation\"; }\n    object test \"Reject unapproved order\" { kind: \"req.test\"; }\n    relation sat \"Satisfies\" @service -> @approval { kind: \"req.satisfies\"; }\n    relation verify \"Verifies\" @test -> @approval { kind: \"req.verifies\"; }\n    relation derive \"Derived from\" @matching -> @approval { kind: \"req.derives\"; }\n}\n\ndata facts {\n    object m1 \"Jan observation\" { kind: record; x_record: {\"month\": \"Jan\", \"date\": \"2026-01-01\", \"value\": 420, \"cost\": 270, \"count\": 8, \"unit\": \"CAD\", \"description\": \"Synthetic monthly procurement value\"}; }\n    object m2 \"Feb observation\" { kind: record; x_record: {\"month\": \"Feb\", \"date\": \"2026-02-01\", \"value\": 570, \"cost\": 320, \"count\": 10, \"unit\": \"CAD\", \"description\": \"Synthetic monthly procurement value\"}; }\n    object m3 \"Mar observation\" { kind: record; x_record: {\"month\": \"Mar\", \"date\": \"2026-03-01\", \"value\": 510, \"cost\": 350, \"count\": 9, \"unit\": \"CAD\", \"description\": \"Synthetic monthly procurement value\"}; }\n    object m4 \"Apr observation\" { kind: record; x_record: {\"month\": \"Apr\", \"date\": \"2026-04-01\", \"value\": 690, \"cost\": 390, \"count\": 12, \"unit\": \"CAD\", \"description\": \"Synthetic monthly procurement value\"}; }\n    object m5 \"May observation\" { kind: record; x_record: {\"month\": \"May\", \"date\": \"2026-05-01\", \"value\": 810, \"cost\": 460, \"count\": 15, \"unit\": \"CAD\", \"description\": \"Synthetic monthly procurement value\"}; }\n    object m6 \"Jun observation\" { kind: record; x_record: {\"month\": \"Jun\", \"date\": \"2026-06-01\", \"value\": 750, \"cost\": 480, \"count\": 14, \"unit\": \"CAD\", \"description\": \"Synthetic monthly procurement value\"}; }\n}\ndata rules {\n    object rule1 \"Rule 1\" { kind: record; x_record: {\"condition\": \"supplier inactive\", \"action\": \"Reject with supplier status message\", \"priority\": 1}; }\n    object rule2 \"Rule 2\" { kind: record; x_record: {\"condition\": \"approval absent\", \"action\": \"Request authorized approval\", \"priority\": 2}; }\n    object rule3 \"Rule 3\" { kind: record; x_record: {\"condition\": \"quantity exceeds tolerance\", \"action\": \"Hold for matching review\", \"priority\": 3}; }\n    object rule4 \"Rule 4\" { kind: record; x_record: {\"condition\": \"all guards pass\", \"action\": \"Post with immutable evidence reference\", \"priority\": 4}; }\n}\ndata notes {\n    object supplier \"SUPPLIERS\" { kind: note; description: \"Approved suppliers provide invoice and delivery evidence.\"; }\n    object inputs \"INPUTS\" { kind: note; description: \"Purchase authorization, item quantities and expected receipt.\"; }\n    object process \"PROCESS\" { kind: note; description: \"Issue order; receive goods; match invoice; post liability.\"; }\n    object outputs \"OUTPUTS\" { kind: note; description: \"Accepted receipt, approved obligation and audit reference.\"; }\n    object customers \"CUSTOMERS\" { kind: note; description: \"Warehouse, accounts payable and the treasury team.\"; }\n    object strength \"STRENGTHS\" { kind: note; description: \"Shared identifiers connect acceptance evidence to accounting.\"; }\n    object weakness \"WEAKNESSES\" { kind: note; description: \"Supplier outages can delay acknowledgement and matching.\"; }\n    object opportunity \"OPPORTUNITIES\" { kind: note; description: \"Publish purpose-scoped events for reconciliation.\"; }\n    object threat \"THREATS\" { kind: note; description: \"Duplicate delivery, stale approval and unknown payment outcomes.\"; }\n    object journey \"ACTOR EXPERIENCE\" { kind: note; description: \"Clear validation feedback and an actionable recovery path.\"; }\n    object verification \"VERIFY\" { kind: note; description: \"Reconcile quantities and values at a named source cutoff.\"; }\n    object review \"REVIEW NOTE\" { kind: note; description: \"This sample is a diagram/contract demonstration, not an implemented purchasing application.\"; }\n}\n","projections/views.ddn":"ddn \"0.4\";\nmodule \"meridian.procurement.views\";\nimport \"./model.ddn\" as m;\nimport \"./formats.ddn\" as f;\n\nview flowchart \"01 / Purchasing control flow\" {\n    data: [@m.process];\n    format: @f.shared.common;\n    projection { kind:graph;profile:\"flow.basic@1\"; }\n\n}\n\nview responsibility_graph \"02 / Shared responsibility assignments\" {\n    data: [@m.process, @m.roles, @m.responsibilities];\n    format: @f.shared.common;\n    projection { kind:graph;profile:\"ddn@1\"; }\n    select: [@m.process.order, @m.process.receive, @m.process.post, @m.roles.buyer, @m.roles.manager, @m.roles.warehouse, @m.roles.controller];\n\n}\n\nview raci \"03 / Model-derived RACI\" {\n    data: [@m.process, @m.roles, @m.responsibilities];\n    format: @f.shared.common;\n    projection { kind:matrix;profile:\"matrix.raci@1\";rows:[@m.process.order, @m.process.receive, @m.process.post];columns:[@m.roles.buyer, @m.roles.manager, @m.roles.warehouse, @m.roles.controller];relation:\"analysis.assignment\";value:\"x_assignment.code\"; }\n\n}\n\nview crud \"04 / Model-derived CRUD\" {\n    data: [@m.process, @m.schema, @m.access];\n    format: @f.shared.common;\n    projection { kind:matrix;profile:\"matrix.crud@1\";rows:[@m.process.order, @m.process.receive, @m.process.post];columns:[@m.schema.supplier, @m.schema.po, @m.schema.receipt];relation:\"analysis.access\";value:\"x_assignment.code\"; }\n\n}\n\nview dfd_gane \"05 / Numbered Gane\\u2013Sarson-style DFD\" {\n    data: [@m.dfd];\n    format: @f.shared.common;\n    projection { kind:graph;profile:\"dfd.gane_sarson@1\"; }\n\n}\n\nview dfd_yourdon \"06 / Yourdon-style DFD\" {\n    data: [@m.dfd];\n    format: @f.shared.common;\n    projection { kind:graph;profile:\"dfd.yourdon@1\"; }\n\n}\n\nview structure \"07 / Declared class / interface subset\" {\n    data: [@m.classes];\n    format: @f.shared.common;\n    projection { kind:graph;profile:\"uml.structure@1\"; }\n\n}\n\nview usecases \"08 / Actor and use-case subset\" {\n    data: [@m.usecases];\n    format: @f.shared.common;\n    projection { kind:graph;profile:\"uml.usecase@1\"; }\n\n}\n\nview requirements \"09 / Requirement traceability\" {\n    data: [@m.requirements];\n    format: @f.shared.common;\n    projection { kind:graph;profile:\"requirements.basic@1\"; }\n\n}\n\nview erd \"10 / Entity-field representation\" {\n    data: [@m.schema];\n    format: @f.shared.common;\n    projection { kind:graph;profile:\"ddn@1\"; }\n\n}\n\nview chen \"11 / Chen binary projection\" {\n    data: [@m.schema];\n    format: @f.shared.common;\n    projection { kind:chen;profile:\"chen.basic@1\"; }\n\n}\n\nview chart_bar \"12 / Synthetic monthly value \\u2014 bar\" {\n    data: [@m.facts];\n    format: @f.shared.common;\n    projection { kind:chart;profile:\"chart.basic@1\";records:[@m.facts.m1, @m.facts.m2, @m.facts.m3, @m.facts.m4, @m.facts.m5, @m.facts.m6];mark:bar;x:\"x_record.month\";y:\"x_record.value\";unit:\"CAD\";width:1120px;height:620px; }\n\n}\n\nview chart_line \"13 / Synthetic monthly value \\u2014 line\" {\n    data: [@m.facts];\n    format: @f.shared.common;\n    projection { kind:chart;profile:\"chart.basic@1\";records:[@m.facts.m1, @m.facts.m2, @m.facts.m3, @m.facts.m4, @m.facts.m5, @m.facts.m6];mark:line;x:\"x_record.month\";y:\"x_record.value\";unit:\"CAD\";width:1120px;height:620px; }\n\n}\n\nview chart_area \"14 / Synthetic monthly value \\u2014 area\" {\n    data: [@m.facts];\n    format: @f.shared.common;\n    projection { kind:chart;profile:\"chart.basic@1\";records:[@m.facts.m1, @m.facts.m2, @m.facts.m3, @m.facts.m4, @m.facts.m5, @m.facts.m6];mark:area;x:\"x_record.month\";y:\"x_record.value\";unit:\"CAD\";width:1120px;height:620px; }\n\n}\n\nview chart_pie \"15 / Synthetic monthly value \\u2014 pie\" {\n    data: [@m.facts];\n    format: @f.shared.common;\n    projection { kind:chart;profile:\"chart.basic@1\";records:[@m.facts.m1, @m.facts.m2, @m.facts.m3, @m.facts.m4, @m.facts.m5, @m.facts.m6];mark:pie;x:\"x_record.month\";y:\"x_record.value\";unit:\"CAD\";width:1120px;height:620px; }\n\n}\n\nview chart_donut \"16 / Synthetic monthly value \\u2014 donut\" {\n    data: [@m.facts];\n    format: @f.shared.common;\n    projection { kind:chart;profile:\"chart.basic@1\";records:[@m.facts.m1, @m.facts.m2, @m.facts.m3, @m.facts.m4, @m.facts.m5, @m.facts.m6];mark:donut;x:\"x_record.month\";y:\"x_record.value\";unit:\"CAD\";width:1120px;height:620px; }\n\n}\n\nview scatter \"17 / Cost versus recorded value\" {\n    data: [@m.facts];\n    format: @f.shared.common;\n    projection { kind:chart;profile:\"chart.basic@1\";records:[@m.facts.m1, @m.facts.m2, @m.facts.m3, @m.facts.m4, @m.facts.m5, @m.facts.m6];mark:point;x:\"x_record.cost\";x_type:number;y:\"x_record.value\";size:\"x_record.count\";unit:\"CAD\"; }\n\n}\n\nview time_series \"18 / UTC monthly observations\" {\n    data: [@m.facts];\n    format: @f.shared.common;\n    projection { kind:chart;profile:\"chart.basic@1\";records:[@m.facts.m1, @m.facts.m2, @m.facts.m3, @m.facts.m4, @m.facts.m5, @m.facts.m6];mark:line;x:\"x_record.date\";x_type:date;y:\"x_record.value\";unit:\"CAD\"; }\n\n}\n\nview record_table \"19 / Shared observation table\" {\n    data: [@m.facts];\n    format: @f.shared.common;\n    projection { kind:table;profile:\"table.records@1\";records:[@m.facts.m1, @m.facts.m2, @m.facts.m3, @m.facts.m4, @m.facts.m5, @m.facts.m6];columns:[{key:\"x_record.month\",label:\"Month\"},{key:\"x_record.value\",label:\"Recorded value (CAD)\"},{key:\"x_record.cost\",label:\"Illustrative cost (CAD)\"},{key:\"x_record.count\",label:\"Count\"}]; }\n\n}\n\nview decision_table \"20 / Declarative decision-table presentation\" {\n    data: [@m.rules];\n    format: @f.shared.common;\n    projection { kind:table;profile:\"table.records@1\";records:[@m.rules.rule1, @m.rules.rule2, @m.rules.rule3, @m.rules.rule4];columns:[{key:\"x_record.priority\",label:\"Priority\"},{key:\"x_record.condition\",label:\"Condition\"},{key:\"x_record.action\",label:\"Expected action\"}];width:1200px; }\n\n}\n\nview gantt \"21 / Supplied-date procurement schedule\" {\n    data: [@m.process, @m.schedule];\n    format: @f.shared.common;\n    projection { kind:timeline;profile:\"timeline.basic@1\";records:[@m.process.order, @m.process.receive, @m.process.post];start:\"x_record.start\";end:\"x_record.end\";dependencies:[@m.schedule.order_before_receive, @m.schedule.receive_before_post];width:1250px; }\n\n}\n\nview schedule_table \"22 / Schedule source records\" {\n    data: [@m.process];\n    format: @f.shared.common;\n    projection { kind:table;profile:\"table.records@1\";records:[@m.process.order, @m.process.receive, @m.process.post];columns:[{key:\"name\",label:\"Task\"},{key:\"x_record.start\",label:\"Start UTC\"},{key:\"x_record.end\",label:\"End exclusive UTC\"},{key:\"x_record.status\",label:\"Status\"}]; }\n\n}\n\nview swot \"23 / Reusable SWOT panel template\" {\n    data: [@m.notes];\n    format: @f.shared.common;\n    projection { kind:panels;profile:\"panels.basic@1\";columns:2;panels:[{id:\"s\",title:\"STRENGTHS\",row:0,column:0,rowspan:1,colspan:1,items:[@m.notes.strength]}, {id:\"w\",title:\"WEAKNESSES\",row:0,column:1,rowspan:1,colspan:1,items:[@m.notes.weakness]}, {id:\"o\",title:\"OPPORTUNITIES\",row:1,column:0,rowspan:1,colspan:1,items:[@m.notes.opportunity]}, {id:\"t\",title:\"THREATS\",row:1,column:1,rowspan:1,colspan:1,items:[@m.notes.threat]}]; }\n\n}\n\nview sipoc \"24 / SIPOC from shared notes\" {\n    data: [@m.notes];\n    format: @f.shared.common;\n    projection { kind:panels;profile:\"panels.basic@1\";columns:5;width:1650px;panels:[{id:\"supplier\",title:\"SUPPLIER\",row:0,column:0,rowspan:1,colspan:1,items:[@m.notes.supplier]}, {id:\"inputs\",title:\"INPUTS\",row:0,column:1,rowspan:1,colspan:1,items:[@m.notes.inputs]}, {id:\"process\",title:\"PROCESS\",row:0,column:2,rowspan:1,colspan:1,items:[@m.notes.process]}, {id:\"outputs\",title:\"OUTPUTS\",row:0,column:3,rowspan:1,colspan:1,items:[@m.notes.outputs]}, {id:\"customers\",title:\"CUSTOMERS\",row:0,column:4,rowspan:1,colspan:1,items:[@m.notes.customers]}]; }\n\n}\n\nview journey \"25 / Service journey with spanning panels\" {\n    data: [@m.notes];\n    format: @f.shared.common;\n    projection { kind:panels;profile:\"panels.basic@1\";columns:3;panels:[{id:\"input\",title:\"INPUT AND EXPECTATION\",row:0,column:0,rowspan:1,colspan:1,items:[@m.notes.inputs]}, {id:\"p\",title:\"PROCESS\",row:0,column:1,rowspan:1,colspan:1,items:[@m.notes.process]}, {id:\"out\",title:\"OUTPUT\",row:0,column:2,rowspan:1,colspan:1,items:[@m.notes.outputs]}, {id:\"actor\",title:\"ACTOR EXPERIENCE\",row:1,column:0,rowspan:1,colspan:3,items:[@m.notes.journey]}, {id:\"verify\",title:\"VERIFICATION AND REVIEW\",row:2,column:0,rowspan:1,colspan:3,items:[@m.notes.verification, @m.notes.review]}]; }\n\n}\n\nview matrix_general \"26 / General relationship matrix\" {\n    data: [@m.process, @m.roles, @m.responsibilities];\n    format: @f.shared.common;\n    projection { kind:matrix;profile:\"matrix.relations@1\";rows:[@m.process.order, @m.process.receive, @m.process.post];columns:[@m.roles.buyer, @m.roles.manager, @m.roles.warehouse, @m.roles.controller];relation:\"analysis.assignment\";value:\"name\"; }\n\n}\n\nview shape_atlas \"27 / Composable semantic silhouettes\" {\n    data: [@m.process, @m.usecases, @m.classes, @m.dfd];\n    format: @f.shared.common;\n    projection { kind:graph;profile:\"ddn@1\"; }\n    select: [@m.process.start, @m.process.capture, @m.process.approve, @m.process.order, @m.process.invoice, @m.process.post, @m.usecases.buyer, @m.usecases.create, @m.classes.package, @m.classes.component, @m.dfd.match, @m.dfd.receipts];\n    layout {algorithm:grid;columns:3;gap:120px;row_gap:100px;}\n    display {relations:none;}\n\n}\n","projections/formats.ddn":"ddn \"0.4\";\nmodule \"meridian.procurement.formats\";\nformat shared {\n    style standard {look: classic; theme: default; font: sans; font_size:16px;}\n    layout logical {algorithm: layered;direction:right;routing:orthogonal;gap:140px;row_gap:130px;}\n    display readable {kind: none;badges:none;fields:names;maturity:none;}\n    publication screen {size:content;fit:none;minimum_text:8pt;}\n    legend key {mode:text;placement:none;}\n    bundle common {style:@standard;layout:@logical;display:@readable;publication:@screen;legend:@key;}\n}\n"}</script>
<script src="../../notation/dist/ddn.global.js"></script>
<script src="../prototype/commands.js"></script>
<script>
'use strict';
const D=window.DDNLive,CMD=window.DesignerCommands;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ENTRY='projections/views.ddn',VIEW='chart_bar';
const ws=D.createWorkspace(JSON.parse(document.getElementById('files').textContent));
const M='meridian.procurement.review::facts.';
document.getElementById('who').textContent=' · '+ENTRY+' # '+VIEW+' · revision '+ws.revision;
const sheet=document.getElementById('sheet');
function renderSheet(editedKey){
 const p=ws.resolve(ENTRY,VIEW).view.profiles.projection;
 const plan=ws.projectionPlan(ENTRY,VIEW);
 const byId=new Map(ws.resolve(ENTRY,VIEW).elements.map(n=>[n.id,n]));
 const records=p.records.map(r=>byId.get(r.$ref)).filter(Boolean);
 const keys=[];for(const n of records)for(const k of Object.keys(n.properties.x_record))if(!keys.includes(k))keys.push(k);
 const caps=ws.inspect(ENTRY,VIEW).capabilities.marks.filter(m=>m!=='source');
 let h='<span class="tag">CHART SOURCE SHEET</span> <code>records edit the shared model · mark and bindings edit this view only</code>';
 h+='<div class="controls"><div><label>Mark (legal set from capabilities.marks)</label><select id="markPick">'+caps.map(m=>'<option '+(p.mark===m?'selected':'')+'>'+esc(m)+'</option>').join('')+'</select></div><div><label>x</label><code>'+esc(p.x)+'</code></div><div><label>y</label><code>'+esc(p.y)+'</code></div><div><label>unit</label><code>'+esc(p.unit)+'</code></div></div>';
 const feb=plan.points.find(pt=>pt.sourceIds&&pt.sourceIds.includes(M+'m2'));
 h+='<div><span class="tag">CONTRIBUTORS · Feb point</span> '+feb.sourceIds.map(id=>'<span class="chip">'+esc(id)+'</span>').join('')+'</div>';
 h+='<table><thead><tr><th>record</th>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr></thead><tbody>';
 for(const n of records){const xr=n.properties.x_record;
  h+='<tr><th>'+esc(n.name)+'</th>'+keys.map(k=>{const key=n.id+'|'+k;return '<td'+(key===editedKey?' class="edited"':'')+'>'+esc(String(xr[k]??'—'))+'</td>';}).join('')+'</tr>';}
 sheet.innerHTML=h+'</tbody></table>';
 document.getElementById('markPick').onchange=e=>{CMD.setChartMark(D,ws,ENTRY,VIEW,{mark:e.target.value});draw(null);};
}
function draw(editedKey){
 document.getElementById('svg').replaceChildren(new DOMParser().parseFromString(ws.renderSync({entry:ENTRY,view:VIEW}).svg,'image/svg+xml').documentElement);
 renderSheet(editedKey);
}
draw(null);
// Live edits: switch the mark bar -> line, then edit m2's value 570 -> 600.
CMD.setChartMark(D,ws,ENTRY,VIEW,{mark:'line'});
CMD.editRecordValue(D,ws,ENTRY,VIEW,{id:M+'m2',key:'value',value:600});
draw(M+'m2|value');
const feb=ws.projectionPlan(ENTRY,VIEW).points.find(pt=>pt.sourceIds&&pt.sourceIds.includes(M+'m2'));
document.getElementById('result').innerHTML='Live edits applied through the command layer: mark <strong>bar → line</strong> (view scope) and record <code>m2</code> value <strong>570 → '+esc(feb.y)+'</strong> (shared model).<br>Workspace revision '+ws.revision+' · Feb point y = <code id="febY">'+esc(feb.y)+'</code> · contributors '+esc(feb.sourceIds.join(', '))+' · undo restores exact bytes';
</script></body></html>

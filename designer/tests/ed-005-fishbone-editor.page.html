n}\n\nview measurement_table \"15 / Shared measurement observations\" {\n    data: [@m.measurements];\n    format: @f.shared.common;\n    projection { kind: \"table\"; profile: \"table.records@1\"; records: [@m.measurements.m0_0, @m.measurements.m0_1, @m.measurements.m0_2, @m.measurements.m0_3, @m.measurements.m0_4, @m.measurements.m0_5, @m.measurements.m0_6, @m.measurements.m0_7, @m.measurements.m0_8, @m.measurements.m0_9, @m.measurements.m0_10, @m.measurements.m0_11, @m.measurements.m1_0, @m.measurements.m1_1, @m.measurements.m1_2, @m.measurements.m1_3, @m.measurements.m1_4, @m.measurements.m1_5, @m.measurements.m1_6, @m.measurements.m1_7, @m.measurements.m1_8, @m.measurements.m1_9, @m.measurements.m1_10, @m.measurements.m1_11]; columns: [{ \"key\": \"name\", \"label\": \"Observation\" }, { \"key\": \"x_record.machine\", \"label\": \"Machine\" }, { \"key\": \"x_record.value\", \"label\": \"Diameter / mm\" }]; }\n\n}\n\nview defect_table \"16 / Shared defect counts\" {\n    data: [@m.defects];\n    format: @f.shared.common;\n    projection { kind: \"table\"; profile: \"table.records@1\"; records: [@m.defects.d0, @m.defects.d1, @m.defects.d2, @m.defects.d3]; columns: [{ \"key\": \"x_record.category\", \"label\": \"Defect category\" }, { \"key\": \"x_record.count\", \"label\": \"Count\" }]; }\n\n}\n\nview dashboard_quality \"17 / Dashboard Quality\" {\n    data: [@m.notes];\n    format: @f.shared.common;\n    projection { kind: \"panels\"; profile: \"panels.composed@1\"; columns: 2; panels: [{ \"id\": \"slot0\", \"title\": \"Pareto\", \"row\": 0, \"column\": 0, \"view\": @pareto }, { \"id\": \"slot1\", \"title\": \"Histogram\", \"row\": 0, \"column\": 1, \"view\": @histogram }, { \"id\": \"slot2\", \"title\": \"Heat Bands\", \"row\": 1, \"column\": 0, \"view\": @heat_bands }, { \"id\": \"slot3\", \"title\": \"Lifecycle\", \"row\": 1, \"column\": 1, \"view\": @lifecycle }]; }\n\n}\n\nview dashboard_operations \"17 / Dashboard Operations\" {\n    data: [@m.notes];\n n}\n", "examples/quality/formats.ddn": "ddn \"0.5\";\nmodule \"meridian.quality.formats\";\nformat shared {\n    style standard { look:classic; theme:default; font:sans; font_size:16px; }\n    layout adaptive { algorithm:layered; routing:orthogonal; crossings:gap; gap:90px; }\n    publication reading { size:content; fit:none; minimum_text:8pt; }\n    legend compact { mode:text; placement:none; }\n    bundle common { style:@standard; layout:@adaptive; publication:@reading; legend:@compact; }\n}\n", "examples/quality/details.ddn": "ddn \"0.5\";\nmodule \"meridian.quality.notations\";\n\ndata chen {\n    object order \"Order\" { kind: \"entity\"; fields { field order_id { x_chen:{key:true}; } field address { x_chen:{composite:true}; fields { field street; field city; } } field tags { x_chen:{multivalued:true}; } field calculated_total { x_chen:{derived:true}; } } }\n    object line \"Order line\" { kind: \"entity\"; x_chen: { \"weak\": true, \"owner\": @order }; fields { field line_no { x_chen:{partial_key:true}; } field quantity; } }\n    relation contains \"Identifies line\" @order -> @line { kind: \"assoc\"; x_chen: { \"identifying\": true, \"owner\": @order, \"weak\": @line, \"from\": { \"min\": 1, \"max\": 1 }, \"to\": { \"min\": 0, \"max\": \"many\" } }; }\n}\n\ndata usecases {\n    object subject \"Quality control system\" { kind: \"uml.subject\"; }\n    object inspector \"Inspector\" { kind: \"uml.actor\"; }\n    object senior \"Senior inspector\" { kind: \"uml.actor\"; }\n    object review \"Review lot\" { kind: \"uml.usecase\"; x_usecase: { \"subjects\": [@subject], \"extension_points\": [\"before disposition\"] }; }\n    object record \"Record evidence\" { kind: \"uml.usecase\"; x_usecase: { \"subjects\": [@subject] }; }\n    object escalate \"Escalate issue\" { kind: \"uml.usecase\"; x_usecase: { \"subjects\": [@subject] }; }\n    relation uses \"Reviews\" @inspector -> @review { kind: \"uml.uses\"; }\n    relation generalizes \"Specializes\" @senior -> @inspector { kind: \"uml.generalization\"; }\n    relation includes \"Includes evidence\" @review -> @record { kind: \"uml.include\"; }\n    relation extends \"Escalates when necessary\" @escalate -> @review { kind: \"uml.extend\"; x_usecase: { \"extension_point\": \"before disposition\", \"condition\": \"The declared review policy requires escalation.\" }; }\n}\n\ndata flow {\n    object start \"Inspection received\" { kind: \"flow.start\"; }\n    object inspect \"Inspect evidence\" { kind: \"flow.process\"; }\n    object decision \"Within limits?\" { kind: \"flow.decision\"; }\n    object store \"Record audit outcome\" { kind: \"flow.storage\"; }\n    object reject \"Nonconformance record\" { kind: \"flow.document\"; }\n    object out \"To closure sheet\" { kind: \"flow.offpage\"; x_continuation: { \"key\": \"QC-A\", \"side\": \"out\", \"page\": \"2\" }; }\n    object in \"From inspection sheet\" { kind: \"flow.offpage\"; x_continuation: { \"key\": \"QC-A\", \"side\": \"in\", \"page\": \"1\" }; }\n    object connector \"A\" { kind: \"flow.connector\"; }\n    object end \"Review complete\" { kind: \"flow.end\"; }\n    object note \"Keep evidence independent of approvals\" { kind: \"flow.annotation\"; }\n    relation a \"Receive\" @start -> @inspect { kind: \"flow.next\"; }\n    relation b \"Evaluate\" @inspect -> @decision { kind: \"flow.next\"; }\n    relation pass \"Accept\" @decision -> @store { kind: \"flow.next\"; x_diagram: { \"branch\": \"accept\" }; }\n    relation fail \"Reject\" @decision -> @reject { kind: \"flow.next\"; x_diagram: { \"branch\": \"reject\" }; }\n    relation c \"Continue\" @store -> @out { kind: \"flow.next\"; }\n    relation d \"Continue\" @reject -> @out { kind: \"flow.next\"; }\n    relation e \"Resume\" @in -> @connector { kind: \"flow.next\"; }\n    relation f \"Close\" @connector -> @end { kind: \"flow.next\"; }\n    relation continuation \"QC-A continuation\" @out -> @in { kind: \"flow.continues\"; }\n    relation annotation \"Evidence note\" @note -> @store { kind: \"flow.annotation\"; }\n}\n"}</script>

const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ENTRY="examples/quality/views.ddn",VIEW="fishbone";
const ws=D.createWorkspace(JSON.parse(document.getElementById("files").textContent));
const M="meridian.quality.quality".replace("quality.quality","quality.review")+"::",CAL=M+"causes.calibration",CAT1=M+"causes.cat1";
document.getElementById("who").textContent=" · "+ENTRY+" # "+VIEW+" · revision "+ws.revision;
function occMap(plan){const m=new Map();(function walk(n){const id=n.node&&n.node.id;if(id){if(!m.has(id))m.set(id,[]);m.get(id).push(n.occurrence);}for(const c of n.children||[])walk(c);})({node:{id:plan.effect.id},occurrence:plan.effect.id,children:plan.categories});return m;}
function renderSheet(){
 const plan=ws.projectionPlan(ENTRY,VIEW),occ=occMap(plan);
 let h="<span class=\"tag\">FISHBONE SHEET</span> <code>ribs are source relationships of relation: \"quality.cause\" · repeated appearances retain one identity</code>";
 h+="<table><thead><tr><th>rib</th><th>kind</th><th>occurrence paths when reused</th></tr></thead><tbody>";
 h+="<tr><th>EFFECT · "+esc(plan.effect.name)+"</th><td><code>quality.effect</code></td><td></td></tr>";
 for(const cat of plan.categories){
  h+="<tr><th>"+esc(cat.node.name)+"</th><td><code>quality.category</code></td><td></td></tr>";
  (function walk(n,d){
   const o=occ.get(n.node.id)||[],reused=o.length>1;
   h+="<tr"+(reused?" class=\"reused\"":"")+"><th>"+"&nbsp;".repeat(d*4)+esc(n.node.name)+(reused?" <span class=\"tag amber\">REUSED · ONE IDENTITY</span>":"")+"</th><td><code>"+esc(n.node.kind)+"</code></td><td class=\"occ\">"+(reused?o.map(x=>"<code>"+esc(x)+"</code>").join("<br>"):"")+"</td></tr>";
   for(const c of n.children||[])walk(c,d+1);
  })(cat,1);
 }
 document.getElementById("sheet").innerHTML=h+"</tbody></table>";
}
function draw(){
 document.getElementById("svg").replaceChildren(new DOMParser().parseFromString(ws.renderSync({entry:ENTRY,view:VIEW}).svg,"image/svg+xml").documentElement);
 renderSheet();
}
draw();
// VE-AC-057 live: attach the existing calibration cause under Materials — relation only.
CMD.attachExistingCause(D,ws,ENTRY,VIEW,{causeId:CAL,parentId:CAT1,relationId:"calibration_materials"});
draw();
const occ=occMap(ws.projectionPlan(ENTRY,VIEW)).get(CAL);
document.getElementById("result").innerHTML="VE-AC-057 live through the command layer: <strong>Calibration drift</strong> (<code>"+esc(CAL)+"</code>) is attached under <strong>Materials</strong> as a second parent — one semantic identity, <strong>"+occ.length+" distinct occurrence paths</strong>, zero new objects, exactly one new relation:<br>"+occ.map(o=>"<code>"+esc(o)+"</code>").join("<br>")+"<br>The second (third rendered) branch is visible above; undo restores exact bytes.";
</script></body></html>

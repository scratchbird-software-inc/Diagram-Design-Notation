<g font-family="sans-serif">
      <text x="0" y="215" font-size="17" font-weight="600" fill="#34332f">02  Centre raised</text>
      <text x="0" y="240" font-size="14" fill="#69675f">Lower corners settle; the middle lifts.</text>
    </g></g>
<g transform="translate(84 502)">
<g pointer-events="none" aria-hidden="true"><path d="M1 137 L329 137 L338 183 C283 183 231 158 165 158 C99 158 46 183 -8 183 Z" fill="#000" fill-opacity="0.24" filter="url(#demo-soft)"/>
<path d="M132 159 Q165 163 198 159" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1.4" filter="url(#demo-contact)"/>

      </g>
      <path d="M26 108 Q123 107 224 109 M26 124 Q89 125 169 123"
        fill="none" stroke="#b8b0a2" stroke-width="1.1" stroke-linecap="round"/>
    
<g font-family="sans-serif">
      <text x="0" y="215" font-size="17" font-weight="600" fill="#34332f">03  Lower corners raised</text>
      <text x="0" y="240" font-size="14" fill="#69675f">The middle settles; the corners lift.</text>
    </g></g>
<g transform="translate(578 502)">

<g font-family="sans-serif">
      <text x="0" y="215" font-size="17" font-weight="600" fill="#34332f">04  One corner raised</text>
      <text x="0" y="240" font-size="14" fill="#69675f">An asymmetric lift at the lower right.</text>
    </g></g>
<text x="66" y="782" font-family="sans-serif" font-size="12" fill="#777267">Technique: custom Bézier shadow path + blur, then opaque paper + crisp sketch strokes and labels.</text></svg>